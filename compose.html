<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="send anonymous messages to Giikatoo">
    <title>Anonymous Message</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/compose.js" defer></script>
</head>
<body>
    <div class="page-intro-overlay"></div>
    <main class="compose-page">
        <a class="back-link" href="index.html">← Back</a>
        <section class="compose-card" aria-labelledby="compose-title">
            <p class="compose-kicker">anonymous letter</p>
            <h1 id="compose-title">Write a Message<br><span>to Giikatoo</span></h1>
            <p class="compose-intro">Messages,<br>drawing requests,<br>suggestions,<br>or anything else you'd like to share.</p>
            <form id="message-form">
                <label for="message">Letter</label>
                <textarea id="message" name="message" rows="4" minlength="3" maxlength="500" required></textarea>
                <p class="character-count"><span id="character-count">0</span>/500</p>

                <button type="submit">Send</button>
                <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>
</body>
</html>
