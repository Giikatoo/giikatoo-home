<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Private inbox</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="assets/js/inbox-auth.js" defer></script>
    <script src="assets/js/inbox.js" defer></script>
</head>
<body>
    <main class="inbox-page">
        <header class="inbox-header">
            <div>
                <p class="compose-kicker">เห้ย เข้ามาดูไร ออกไปนะ</p>
                <h1>Mailbox</h1>
            </div>
            <button id="sign-out" class="inbox-button secondary" type="button" hidden>Sign out</button>
        </header>

        <section id="login-panel" class="inbox-panel" aria-labelledby="login-title">
            <div id="login-mailbox" class="login-mailbox" aria-hidden="true">
                <img src="assets/images/mailbox.png" alt="" class="mailbox-img">
            </div>
            <h2 id="login-title">Only for Giikatoo</h2>
            <form id="login-form">
                <label for="email">Email</label>
                <input id="email" type="email" autocomplete="email" required>
                <label for="password">Password</label>
                <input id="password" type="password" autocomplete="current-password" required>
                <button class="inbox-button" type="submit">Sign in</button>
            </form>
            <p id="login-status" class="inbox-status" role="status" aria-live="polite"></p>
        </section>

        <section id="letters-panel" class="inbox-panel" hidden aria-labelledby="letters-title">
            <div class="inbox-panel-heading">
                <h2 id="letters-title">Messages</h2>
                <button id="refresh-letters" class="inbox-button secondary" type="button">Refresh</button>
            </div>
            <p id="inbox-status" class="inbox-status" role="status" aria-live="polite"></p>
            <div id="letters-list" class="letters-list"></div>
        </section>
    </main>
</body>
</html>
